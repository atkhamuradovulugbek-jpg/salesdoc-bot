/* logo joylashuvi */
.L{position:absolute;left:50%;top:50%;width:26%;transform:translate(-50%,-50%);z-index:3}
.mini .L{left:88.69%;top:3.78%;width:4.25%;transform:translate(-50%,0)}   /* prezentatsiyadagi haqiqiy joy */
.L>*{position:absolute;left:0;top:0;width:100%;height:100%}
.L img{position:relative;display:block;width:100%;height:auto}
.L .logo{position:relative}

/* ===== 1) fade + 0.9→1.0, keyin yaltirash ===== */
.play .v1 .logo{animation:v1in 1s cubic-bezier(.33,1,.68,1) both}
@keyframes v1in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.v1 .shine{overflow:hidden;-webkit-mask:var(--logo) center/100% 100% no-repeat;mask:var(--logo) center/100% 100% no-repeat}
.v1 .shine::before{content:"";position:absolute;top:-10%;bottom:-10%;width:30%;left:0;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.85),transparent);transform:translateX(-200%) skewX(-20deg);opacity:0}
.play .v1 .shine::before{animation:sweep .9s ease-in-out 1.25s both}
@keyframes sweep{0%{opacity:1;transform:translateX(-200%) skewX(-20deg)}100%{opacity:1;transform:translateX(450%) skewX(-20deg)}}

/* ===== 2) chapdan o'ngga maska bilan ochilish ===== */
.v2 .logo{-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 55%);mask-image:linear-gradient(90deg,#000 45%,transparent 55%);
  -webkit-mask-size:240% 100%;mask-size:240% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:0 0;mask-position:0 0}
.play .v2 .logo{animation:wipe 1.45s ease-in-out .15s both,v2x 1.65s cubic-bezier(.33,1,.68,1) .15s both}
@keyframes wipe{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes v2x{from{transform:translateX(-6%)}to{transform:none}}
.v2 .edge{left:0;width:3px;height:110%;top:-5%;background:rgba(255,190,215,.9);filter:blur(1.5px);opacity:0;border-radius:2px}
.play .v2 .edge{animation:edge 1.45s ease-in-out .15s both}
@keyframes edge{0%{opacity:0;transform:translateX(0)}15%{opacity:.6}50%{opacity:.6}85%{opacity:.6}100%{opacity:0;transform:translateX(var(--ew))}}

/* ===== 3) pastdan ko'tarilish + blur'dan aniq + soya ===== */
.play .v3 .logo{animation:rise 1.3s cubic-bezier(.33,1,.68,1) both}
@keyframes rise{0%{opacity:0;transform:translateY(28%);filter:blur(10px)}70%{opacity:1}100%{opacity:1;transform:none;filter:blur(0)}}
.v3 .shadow{top:12%;-webkit-mask:var(--logo) center/100% 100% no-repeat;mask:var(--logo) center/100% 100% no-repeat;
  background:#000;filter:blur(8px);opacity:0;z-index:-1}
.play .v3 .shadow{animation:shadow 1.3s cubic-bezier(.33,1,.68,1) both}
.v3 .shadow{opacity:.5}
@keyframes shadow{0%{opacity:0;transform:translateY(28%) scale(.95)}100%{opacity:.5;transform:none}}

/* ===== 4) markazdan nur halqasi ===== */
.v4 .core,.v4 .ring{left:50%;top:50%;width:250%;height:auto;aspect-ratio:1;border-radius:50%;opacity:0;
  transform:translate(-50%,-50%) scale(.6)}
.v4 .core{background:radial-gradient(circle,rgba(var(--pink),.85) 0%,rgba(var(--pink),.35) 30%,transparent 65%)}
.v4 .ring{border:3px solid rgba(255,150,195,.95);filter:blur(1px)}
.mini .v4 .ring{border-width:1px}
.play .v4 .core{animation:core 1.7s ease-out both}
.play .v4 .r1{animation:ring 1.25s cubic-bezier(.33,1,.68,1) .1s both}
.play .v4 .r2{animation:ring2 1.25s cubic-bezier(.33,1,.68,1) .45s both}
@keyframes core{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}45%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes ring{0%{opacity:.95;transform:translate(-50%,-50%) scale(.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes ring2{0%{opacity:.5;transform:translate(-50%,-50%) scale(.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.play .v4 .logo{animation:pop4 1.2s var(--back) .3s both,bright 1.45s ease-out .45s both}
@keyframes pop4{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes bright{from{filter:brightness(1.9) saturate(.5)}to{filter:none}}
